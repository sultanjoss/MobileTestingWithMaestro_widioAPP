appId: com.wdiodemoapp
tags:
    - positif

env:
    EMAIL : test@example.com
    PASSWORD : '12345678'
---
- launchApp

- runFlow:
    file: C:/Users/Surface/maestro_first/subflowsauthentication/open_login.yaml

- runFlow:
    file: C:/Users/Surface/maestro_first/subflowsauthentication/fill_email.yaml
    env: 
        EMAIL: ${EMAIL}

- runFlow:
    file: C:/Users/Surface/maestro_first/subflowsauthentication/fill_password.yaml
    env: 
        PASSWORD: ${PASSWORD}

- runFlow:
    file: C:/Users/Surface/maestro_first/subflowsauthentication/submit_login.yaml


- assertVisible:
    text: "Success"
- takeScreenshot: login_sukses
